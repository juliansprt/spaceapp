name: "Income100 PR #124 2026-10-19 upstream-adb96 / Source Security only"

on:
  push:
    branches:
      - ci/pr124-mainadb-source-security-20261019

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: source-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, dependencies, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juliansprt/spaceapp
          ref: 6f3c888d0ed5f5e07dbdd27ae21140620c613cc7
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact isolated merge, parents and tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "6f3c888d0ed5f5e07dbdd27ae21140620c613cc7"
          test "$(git show -s --format=%P HEAD)" = "adb96ac77531649bd335078aacaa0318ce1d20a2 f3e72f9451616a97c0727517ac0dac14ef4a6ecd"
          test "$(git rev-parse HEAD^{tree})" = "9f47419daf14abe3bffd2f4f58b177b144821276"
          test -z "$(git status --porcelain)"
          printf 'Verified PR #124 isolated merge SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Install ripgrep and ffmpeg (the file search tests run the real rg, the Nous attachment tests make media with ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg

      - run: npm run test:public
      - run: npm run public:export:verify

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Block fixable Medium, High, and Critical filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-filesystem.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload blocking filesystem scan
        if: always() && hashFiles('trivy-filesystem.sarif') != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: trivy-filesystem.sarif

      - name: Capture all filesystem findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-full-filesystem.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Summarize all filesystem findings
        if: always() && hashFiles('trivy-full-filesystem.json') != ''
        run: >-
          node scripts/trivy-report-summary.mjs
          --input trivy-full-filesystem.json
          --label filesystem
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full filesystem report
        if: always() && hashFiles('trivy-full-filesystem.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-full-filesystem
          path: trivy-full-filesystem.json
          if-no-files-found: error

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: spaceapp-source.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-sbom
          path: spaceapp-source.spdx.json
          if-no-files-found: error

