name: "Income100 PR #124 2026-10-19 upstream-adb96 integration / CI"

on:
  push:
    branches:
      - ci/pr124-mainadb-quality-20261019

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-quality:
    name: Sanitized public quality gates
    runs-on: ubuntu-latest
    # The full workspace suites take about 25 minutes (review F15).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juliansprt/spaceapp
          ref: 6f3c888d0ed5f5e07dbdd27ae21140620c613cc7
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the exact PR merge, parents and tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "6f3c888d0ed5f5e07dbdd27ae21140620c613cc7"
          test "$(git show -s --format=%P HEAD)" = "adb96ac77531649bd335078aacaa0318ce1d20a2 f3e72f9451616a97c0727517ac0dac14ef4a6ecd"
          test "$(git rev-parse HEAD^{tree})" = "9f47419daf14abe3bffd2f4f58b177b144821276"
          test -z "$(git status --porcelain)"
          printf 'Verified PR #124 exact virtual merge SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Issue #64 explicitly exempts the upstream export manifest from this contributor change.
      # Keep the actual result visible; this exception applies only to this fork verification copy.
      - name: Verify export provenance (upstream allows contributor mismatch)
        id: export-provenance
        continue-on-error: true
        run: node scripts/verify-export-provenance.mjs .

      - name: Record export provenance outcome
        if: always()
        env:
          PROVENANCE_OUTCOME: ${{ steps.export-provenance.outcome }}
        run: |
          printf 'Export provenance outcome: %s. Issue #64 allows an upstream-manifest mismatch for contributor changes; this records the actual outcome.\n' "$PROVENANCE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Create sanitized candidate
        run: >-
          node scripts/public-export.mjs
          --output "$RUNNER_TEMP/spaceapp-public-export"

      - name: Install candidate dependencies
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm ci

      - name: Install ripgrep and ffmpeg (upstream public tests require both)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg

      - name: Public release tests
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run test:public

      - name: Typecheck candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run check

      - name: Build candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run build

      - name: Pack launcher candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run pack:dry-run -w run-spaceapp
