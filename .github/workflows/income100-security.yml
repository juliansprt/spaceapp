name: "Income100 PR #124 merge tree verification / Security"

on:
  push:
    branches:
      - ci/per-service-images

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-changes:
    name: Detect container source changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juliansprt/spaceapp
          ref: 0fd10d52b1089d973b2cbfb6931bf4f9113bdd83
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact fork merge, parents and tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0fd10d52b1089d973b2cbfb6931bf4f9113bdd83"
          test "$(git show -s --format=%P HEAD)" = "f3e72f9451616a97c0727517ac0dac14ef4a6ecd 98bcb3859778b85951c6f15902fe82f156562f9e"
          test "$(git rev-parse HEAD^{tree})" = "ff1e7c00289b11ec65b8c8a15f212f29d95c68a8"
          test -z "$(git status --porcelain)"
          printf 'Verified PR #124 fork merge SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Require image scans for fork candidate verification
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # This fork-only push always verifies the pinned candidate, like a manual dispatch.
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            apps \
            packages \
            ':(exclude)packages/run-spaceapp/**' \
            deploy/docker \
            starter-memory \
            Dockerfile \
            scripts/stage-container-runtime.mjs \
            package-lock.json; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

  source:
    name: Source, dependencies, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juliansprt/spaceapp
          ref: 0fd10d52b1089d973b2cbfb6931bf4f9113bdd83
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact fork merge, parents and tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0fd10d52b1089d973b2cbfb6931bf4f9113bdd83"
          test "$(git show -s --format=%P HEAD)" = "f3e72f9451616a97c0727517ac0dac14ef4a6ecd 98bcb3859778b85951c6f15902fe82f156562f9e"
          test "$(git rev-parse HEAD^{tree})" = "ff1e7c00289b11ec65b8c8a15f212f29d95c68a8"
          test -z "$(git status --porcelain)"
          printf 'Verified PR #124 fork merge SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Install ripgrep (the file search tests run the real rg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - run: npm run test:public
      - run: npm run public:export:verify

      - name: Fetch the separate fork workflow push for its history scan
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git cat-file -e "$GITHUB_SHA^{commit}"
          git merge-base --is-ancestor "f3e72f9451616a97c0727517ac0dac14ef4a6ecd" "$GITHUB_SHA"

      - name: Secret scan of the fork push history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Preserve the contributor-plus-wrapper push scan; it does not scan the merge tree.
          BASE_REF: f3e72f9451616a97c0727517ac0dac14ef4a6ecd

      - name: Secret scan of the exact virtual merge tree
        id: merge-tree-secret-scan
        shell: bash
        run: |
          merge_snapshot="$RUNNER_TEMP/spaceapp-pr124-merge-gitleaks"
          mkdir -p "$merge_snapshot"
          git archive "0fd10d52b1089d973b2cbfb6931bf4f9113bdd83" | tar -x -C "$merge_snapshot"
          gitleaks version
          gitleaks dir --redact --exit-code=2 --report-format=sarif \
            --report-path="$RUNNER_TEMP/gitleaks-merge-tree.sarif" \
            --config="$merge_snapshot/.gitleaks.toml" "$merge_snapshot"

      - name: Upload exact merge tree secret scan
        if: always() && (steps.merge-tree-secret-scan.outcome == 'success' || steps.merge-tree-secret-scan.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-pr124-merge-tree
          path: ${{ runner.temp }}/gitleaks-merge-tree.sarif
          if-no-files-found: error

      - name: Block fixable Medium, High, and Critical filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-filesystem.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload blocking filesystem scan
        if: always() && hashFiles('trivy-filesystem.sarif') != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: trivy-filesystem.sarif
          ref: refs/heads/ci/pr124-merge-source
          sha: 0fd10d52b1089d973b2cbfb6931bf4f9113bdd83

      - name: Capture all filesystem findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-full-filesystem.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Summarize all filesystem findings
        if: always() && hashFiles('trivy-full-filesystem.json') != ''
        run: >-
          node scripts/trivy-report-summary.mjs
          --input trivy-full-filesystem.json
          --label filesystem
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full filesystem report
        if: always() && hashFiles('trivy-full-filesystem.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-full-filesystem
          path: trivy-full-filesystem.json
          if-no-files-found: error

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: spaceapp-source.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-sbom
          path: spaceapp-source.spdx.json
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juliansprt/spaceapp
          ref: 0fd10d52b1089d973b2cbfb6931bf4f9113bdd83
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the exact fork merge, parents and tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0fd10d52b1089d973b2cbfb6931bf4f9113bdd83"
          test "$(git show -s --format=%P HEAD)" = "f3e72f9451616a97c0727517ac0dac14ef4a6ecd 98bcb3859778b85951c6f15902fe82f156562f9e"
          test "$(git rev-parse HEAD^{tree})" = "ff1e7c00289b11ec65b8c8a15f212f29d95c68a8"
          test -z "$(git status --porcelain)"
          printf 'Verified PR #124 fork merge SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juliansprt/spaceapp
          ref: 0fd10d52b1089d973b2cbfb6931bf4f9113bdd83
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the exact fork merge, parents and tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0fd10d52b1089d973b2cbfb6931bf4f9113bdd83"
          test "$(git show -s --format=%P HEAD)" = "f3e72f9451616a97c0727517ac0dac14ef4a6ecd 98bcb3859778b85951c6f15902fe82f156562f9e"
          test "$(git rev-parse HEAD^{tree})" = "ff1e7c00289b11ec65b8c8a15f212f29d95c68a8"
          test -z "$(git status --porcelain)"
          printf 'Verified PR #124 fork merge SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: javascript-typescript

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          ref: refs/heads/ci/pr124-merge-source
          sha: 0fd10d52b1089d973b2cbfb6931bf4f9113bdd83

  image:
    name: Image scan / ${{ matrix.target }}
    needs: container-changes
    if: needs.container-changes.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - browser
          - cli
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juliansprt/spaceapp
          ref: 0fd10d52b1089d973b2cbfb6931bf4f9113bdd83
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the exact fork merge, parents and tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0fd10d52b1089d973b2cbfb6931bf4f9113bdd83"
          test "$(git show -s --format=%P HEAD)" = "f3e72f9451616a97c0727517ac0dac14ef4a6ecd 98bcb3859778b85951c6f15902fe82f156562f9e"
          test "$(git rev-parse HEAD^{tree})" = "ff1e7c00289b11ec65b8c8a15f212f29d95c68a8"
          test -z "$(git status --porcelain)"
          printf 'Verified PR #124 fork merge SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: spaceapp-${{ matrix.target }}:security-scan
          cache-from: type=gha,scope=security-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.target }}

      - name: Block fixable Medium, High, and Critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: spaceapp-${{ matrix.target }}:security-scan
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.target }}.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload blocking image scan
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.target)) != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          ref: refs/heads/ci/pr124-merge-source
          sha: 0fd10d52b1089d973b2cbfb6931bf4f9113bdd83

      - name: Capture all image findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: spaceapp-${{ matrix.target }}:security-scan
          format: json
          output: trivy-full-${{ matrix.target }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Summarize all image findings
        if: always() && hashFiles(format('trivy-full-{0}.json', matrix.target)) != ''
        run: >-
          node scripts/trivy-report-summary.mjs
          --input "trivy-full-${{ matrix.target }}.json"
          --label "${{ matrix.target }}"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full image report
        if: always() && hashFiles(format('trivy-full-{0}.json', matrix.target)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-full-${{ matrix.target }}
          path: trivy-full-${{ matrix.target }}.json
          if-no-files-found: error
